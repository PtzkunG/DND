<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลูกเต๋า 21 หน้า - 21-Sided Fortune Dice</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #090d16;
            color: #f1f5f9;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Ambient Glow Backdrop */
        .bg-glow {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(9, 13, 22, 0) 70%);
            pointer-events: none;
            transition: background 0.6s ease;
            z-index: 1;
        }

        /* Top Bar Header */
        header {
            width: 100%;
            max-width: 480px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #e2e8f0;
        }

        .brand i {
            color: #818cf8;
        }

        .icon-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #94a3b8;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 480px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 16px;
            z-index: 10;
        }

        /* Result Display Card */
        .outcome-card {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: border-color 0.4s ease;
        }

        .res-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            width: 54px;
            text-align: center;
            color: #cbd5e1;
            line-height: 1;
        }

        .res-info {
            flex: 1;
            margin-left: 12px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            margin-bottom: 4px;
        }

        .res-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        .res-range {
            font-family: monospace;
            font-size: 0.75rem;
            color: #64748b;
            background: rgba(30, 41, 59, 0.6);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(51, 65, 85, 0.5);
        }

        /* Interactive 3D CSS Polyhedron Container */
        .dice-stage {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 800px;
            cursor: pointer;
        }

        /* Glowing D21 Octagonal Gem */
        .d21-gem {
            width: 170px;
            height: 170px;
            position: relative;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #0f172a 100%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            border: 2px solid rgba(129, 140, 248, 0.4);
            box-shadow: 0 0 35px rgba(99, 102, 241, 0.4), inset 0 0 25px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .d21-gem::before {
            content: '';
            position: absolute;
            inset: 6px;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .d21-gem:active {
            transform: scale(0.94);
        }

        .d21-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(129, 140, 248, 0.8);
            line-height: 1;
            z-index: 2;
        }

        .d21-subtext {
            font-size: 0.7rem;
            font-weight: 600;
            color: #818cf8;
            margin-top: 4px;
            letter-spacing: 1px;
            z-index: 2;
        }

        /* Rolling Animation */
        .rolling-anim {
            animation: tumble 0.15s infinite linear;
        }

        @keyframes tumble {
            0% { transform: rotate(0deg) scale(0.95); }
            25% { transform: rotate(90deg) scale(1.05); }
            50% { transform: rotate(180deg) scale(0.95); }
            75% { transform: rotate(270deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(0.95); }
        }

        /* Tier Legend Grid */
        .tier-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 12px 0;
        }

        .tier-card {
            padding: 8px 4px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.7rem;
            border: 1px solid transparent;
        }

        .tier-card .num {
            font-weight: 800;
            font-size: 0.75rem;
        }

        .tier-1 { background: rgba(136, 19, 55, 0.3); border-color: rgba(225, 29, 72, 0.4); color: #fda4af; }
        .tier-1 .num { color: #f43f5e; }

        .tier-2 { background: rgba(30, 41, 59, 0.5); border-color: rgba(51, 65, 85, 0.6); color: #cbd5e1; }
        .tier-2 .num { color: #e2e8f0; }

        .tier-3 { background: rgba(8, 47, 73, 0.4); border-color: rgba(6, 182, 212, 0.4); color: #a5f3fc; }
        .tier-3 .num { color: #22d3ee; }

        .tier-4 { background: rgba(69, 26, 3, 0.4); border-color: rgba(245, 158, 11, 0.5); color: #fde68a; }
        .tier-4 .num { color: #fbbf24; }

        /* Action Buttons */
        .action-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #6366f1 50%, #06b6d4 100%);
            background-size: 200% 200%;
            border: none;
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 14px 20px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-secondary {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fbbf24;
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .btn-secondary:active {
            transform: scale(0.95);
            background: #334155;
        }

        /* History Slide-Up Panel */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #334155;
            border-radius: 24px 24px 0 0;
            padding: 16px 20px 24px;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sheet-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .stat-box .val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #818cf8;
        }

        .stat-box .lbl {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
        }

        .history-item {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .hist-num {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <!-- Ambient Glow Background -->
    <div id="bgGlow" class="bg-glow"></div>

    <!-- Top Navigation Header -->
    <header>
        <div class="brand">
            <i class="fas fa-dice-d20"></i>
            <span>ลูกเต๋า 21 หน้า</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button id="soundBtn" class="icon-btn" title="เปิด/ปิด เสียง">
                <i id="soundIcon" class="fas fa-volume-high"></i>
            </button>
            <button id="historyBtn" class="icon-btn" title="ประวัติการทอย">
                <i class="fas fa-clock-rotate-left"></i>
            </button>
        </div>
    </header>

    <!-- Main Mobile Layout -->
    <main>
        
        <!-- Result Display Card -->
        <div id="outcomeCard" class="outcome-card">
            <div id="resNum" class="res-number">--</div>
            <div class="res-info">
                <span id="resBadge" class="badge">พร้อมทอย</span>
                <div id="resTitle" class="res-title">กดปุ่มสุ่มโชคชะตา 21 หน้า</div>
            </div>
            <div id="resRange" class="res-range">1-21</div>
        </div>

        <!-- Dynamic D21 Octagonal Crystal Polyhedron -->
        <div class="dice-stage" id="diceStage">
            <div id="d21Gem" class="d21-gem">
                <div id="d21Num" class="d21-number">21</div>
                <div id="d21Sub" class="d21-subtext"><i class="fas fa-touch-app"></i> แตะเพื่อสุ่ม</div>
            </div>
        </div>

        <!-- Fortune Tier Legend Card -->
        <div class="tier-grid">
            <div class="tier-card tier-1">
                <div class="num">1-7</div>
                <div>โชคร้าย</div>
            </div>
            <div class="tier-card tier-2">
                <div class="num">8-13</div>
                <div>ปกติ</div>
            </div>
            <div class="tier-card tier-3">
                <div class="num">14-19</div>
                <div>โชคปานกลาง</div>
            </div>
            <div class="tier-card tier-4">
                <div class="num">20-21</div>
                <div>โชคดีสุดๆ</div>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="action-grid">
            <button id="rollBtn" class="btn-primary">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>ทำนายโชคชะตา</span>
            </button>
            <button id="quick5Btn" class="btn-secondary">
                <i class="fas fa-bolt"></i>
                <span>5x</span>
            </button>
        </div>

    </main>

    <!-- History Bottom Sheet Drawer -->
    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h3 style="font-weight: 700; font-size: 1rem;">ประวัติการทอย & สถิติ</h3>
            <button id="resetBtn" style="background:none; border:none; color:#ef4444; font-size:0.8rem; cursor:pointer; font-weight:600;">
                <i class="fas fa-trash"></i> ล้างประวัติ
            </button>
        </div>

        <div class="stats-summary">
            <div class="stat-box">
                <div id="statTotal" class="val">0</div>
                <div class="lbl">ทอยทั้งหมด (ครั้ง)</div>
            </div>
            <div class="stat-box">
                <div id="statAvg" class="val">0.0</div>
                <div class="lbl">ค่าเฉลี่ยแต้ม</div>
            </div>
        </div>

        <div id="historyList" class="history-list">
            <div id="emptyMsg" style="text-align: center; color: #64748b; padding: 20px 0; font-size: 0.85rem;">
                ยังไม่มีประวัติการทอย
            </div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer for Tumbling Sounds & Fortune Cues
        class SoundSynth {
            constructor() {
                this.muted = false;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Tumbling tick / bounce sound during roll cycle
            playPop(freq = 400) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.04);

                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch(e) {}
            }

            // Sound cue when roll lands on Tier 1 (โชคร้าย 1-7)
            playBad() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.3);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }

            // Sound cue when roll lands on Tier 2 (ปกติ 8-13)
            playNormal() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(554.37, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            }

            // Sound cue when roll lands on Tier 3 (โชคปานกลาง 14-19)
            playGood() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    [523.25, 659.25, 783.99].forEach((f, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.06);

                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.06 + 0.2);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.06);
                        osc.stop(this.ctx.currentTime + i * 0.06 + 0.2);
                    });
                } catch(e) {}
            }

            // Sound cue when roll lands on Tier 4 (โชคดีสุดๆ 20-21)
            playWin() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.08);

                        gain.gain.setValueAtTime(0.25, this.ctx.currentTime + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.35);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.08);
                        osc.stop(this.ctx.currentTime + i * 0.08 + 0.35);
                    });
                } catch(e) {}
            }

            // Helper to play appropriate sound based on result value
            playResultSound(val) {
                if (val >= 1 && val <= 7) {
                    this.playBad();
                } else if (val >= 8 && val <= 13) {
                    this.playNormal();
                } else if (val >= 14 && val <= 19) {
                    this.playGood();
                } else {
                    this.playWin();
                }
            }
        }

        // Fortune Tier Mapping
        function getFortune(val) {
            if (val >= 1 && val <= 7) {
                return {
                    name: 'โชคร้าย',
                    desc: 'ระมัดระวังเรื่องรอบตัว มีอุปสรรคเข้ามา',
                    range: '1-7',
                    color: '#f43f5e',
                    badgeBg: 'rgba(136, 19, 55, 0.6)',
                    badgeColor: '#fda4af',
                    borderColor: 'rgba(225, 29, 72, 0.6)'
                };
            } else if (val >= 8 && val <= 13) {
                return {
                    name: 'ปกติ',
                    desc: 'เรียบง่าย สมดุล ไม่มีเรื่องร้ายหรือดีพิเศษ',
                    range: '8-13',
                    color: '#cbd5e1',
                    badgeBg: '#1e293b',
                    badgeColor: '#cbd5e1',
                    borderColor: 'rgba(51, 65, 85, 0.6)'
                };
            } else if (val >= 14 && val <= 19) {
                return {
                    name: 'โชคปานกลาง',
                    desc: 'มีเกณฑ์สมหวัง สิ่งที่หวังคืบหน้าได้ดี',
                    range: '14-19',
                    color: '#22d3ee',
                    badgeBg: 'rgba(8, 47, 73, 0.6)',
                    badgeColor: '#a5f3fc',
                    borderColor: 'rgba(6, 182, 212, 0.6)'
                };
            } else {
                return {
                    name: 'โชคดีสุดๆ',
                    desc: 'ดวงปังสูงสุด! ประสบความสำเร็จและได้โชคใหญ่',
                    range: '20-21',
                    color: '#fbbf24',
                    badgeBg: 'rgba(69, 26, 3, 0.8)',
                    badgeColor: '#fde68a',
                    borderColor: 'rgba(245, 158, 11, 0.7)'
                };
            }
        }

        // Main App Handler
        class D21App {
            constructor() {
                this.sound = new SoundSynth();
                this.history = [];
                this.isRolling = false;

                this.dom = {
                    rollBtn: document.getElementById('rollBtn'),
                    quick5Btn: document.getElementById('quick5Btn'),
                    diceStage: document.getElementById('diceStage'),
                    d21Gem: document.getElementById('d21Gem'),
                    d21Num: document.getElementById('d21Num'),
                    d21Sub: document.getElementById('d21Sub'),
                    resNum: document.getElementById('resNum'),
                    resBadge: document.getElementById('resBadge'),
                    resTitle: document.getElementById('resTitle'),
                    resRange: document.getElementById('resRange'),
                    outcomeCard: document.getElementById('outcomeCard'),
                    bgGlow: document.getElementById('bgGlow'),
                    soundBtn: document.getElementById('soundBtn'),
                    soundIcon: document.getElementById('soundIcon'),
                    historyBtn: document.getElementById('historyBtn'),
                    bottomSheet: document.getElementById('bottomSheet'),
                    sheetBackdrop: document.getElementById('sheetBackdrop'),
                    historyList: document.getElementById('historyList'),
                    emptyMsg: document.getElementById('emptyMsg'),
                    statTotal: document.getElementById('statTotal'),
                    statAvg: document.getElementById('statAvg'),
                    resetBtn: document.getElementById('resetBtn')
                };

                this.bindEvents();
            }

            bindEvents() {
                this.dom.rollBtn.addEventListener('click', () => this.roll());
                this.dom.diceStage.addEventListener('click', () => this.roll());
                this.dom.quick5Btn.addEventListener('click', () => this.quick5());

                this.dom.soundBtn.addEventListener('click', () => {
                    this.sound.muted = !this.sound.muted;
                    this.dom.soundIcon.className = this.sound.muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
                });

                const openSheet = () => {
                    this.dom.bottomSheet.classList.add('open');
                    this.dom.sheetBackdrop.classList.add('open');
                };
                const closeSheet = () => {
                    this.dom.bottomSheet.classList.remove('open');
                    this.dom.sheetBackdrop.classList.remove('open');
                };

                this.dom.historyBtn.addEventListener('click', openSheet);
                this.dom.sheetBackdrop.addEventListener('click', closeSheet);
                this.dom.resetBtn.addEventListener('click', () => this.reset());
            }

            vibrate(pattern = 10) {
                if (navigator.vibrate) {
                    try { navigator.vibrate(pattern); } catch(e) {}
                }
            }

            roll() {
                if (this.isRolling) return;
                this.isRolling = true;
                this.dom.d21Gem.classList.add('rolling-anim');
                this.dom.d21Sub.textContent = 'กำลังสุ่ม...';

                const result = Math.floor(Math.random() * 21) + 1;
                const duration = 1000;
                const startTime = performance.now();

                const animate = (now) => {
                    const elapsed = now - startTime;
                    if (elapsed < duration) {
                        const temp = Math.floor(Math.random() * 21) + 1;
                        this.dom.d21Num.textContent = temp;
                        this.dom.resNum.textContent = temp;
                        this.sound.playPop(300 + Math.random() * 300);
                        this.vibrate(5);
                        setTimeout(() => requestAnimationFrame(animate), 60);
                    } else {
                        this.finishRoll(result);
                    }
                };

                requestAnimationFrame(animate);
            }

            quick5() {
                if (this.isRolling) return;
                let count = 0;
                const interval = setInterval(() => {
                    if (count >= 5) {
                        clearInterval(interval);
                        return;
                    }
                    const val = Math.floor(Math.random() * 21) + 1;
                    const fortune = getFortune(val);
                    this.updateUI(val, fortune);
                    this.addHistory(val, fortune);
                    this.sound.playResultSound(val);
                    this.vibrate(10);
                    count++;
                }, 220);
            }

            finishRoll(val) {
                this.isRolling = false;
                this.dom.d21Gem.classList.remove('rolling-anim');
                this.dom.d21Sub.innerHTML = '<i class="fas fa-touch-app"></i> แตะเพื่อสุ่ม';

                const fortune = getFortune(val);
                this.updateUI(val, fortune);
                this.addHistory(val, fortune);

                // Play unique sound corresponding to fortune tier for every roll
                this.sound.playResultSound(val);

                if (val >= 20) {
                    if (window.confetti) {
                        confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
                    }
                }
                this.vibrate([15, 30, 15]);
            }

            updateUI(val, fortune) {
                this.dom.d21Num.textContent = val;
                this.dom.resNum.textContent = val;
                this.dom.resNum.style.color = fortune.color;

                this.dom.resBadge.textContent = fortune.name;
                this.dom.resBadge.style.background = fortune.badgeBg;
                this.dom.resBadge.style.color = fortune.badgeColor;

                this.dom.resTitle.textContent = fortune.desc;
                this.dom.resRange.textContent = fortune.range;
                this.dom.outcomeCard.style.borderColor = fortune.borderColor;

                this.dom.bgGlow.style.background = `radial-gradient(circle, ${fortune.color}40 0%, rgba(9, 13, 22, 0) 70%)`;
            }

            addHistory(val, fortune) {
                this.history.unshift({ val, fortune, time: new Date().toLocaleTimeString() });

                if (this.dom.emptyMsg) this.dom.emptyMsg.style.display = 'none';

                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div class="hist-num" style="background:${fortune.badgeBg}; color:${fortune.badgeColor};">
                            ${val}
                        </div>
                        <div>
                            <div style="font-weight:700; color:${fortune.color};">${fortune.name}</div>
                            <div style="font-size:0.65rem; color:#64748b;">แต้ม ${val} (${fortune.range})</div>
                        </div>
                    </div>
                    <div style="font-size:0.7rem; color:#64748b;">${this.history[0].time}</div>
                `;

                this.dom.historyList.insertBefore(item, this.dom.historyList.firstChild);

                // Stats calculation
                const vals = this.history.map(h => h.val);
                this.dom.statTotal.textContent = vals.length;
                this.dom.statAvg.textContent = (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
            }

            reset() {
                this.history = [];
                this.dom.historyList.innerHTML = '<div id="emptyMsg" style="text-align: center; color: #64748b; padding: 20px 0; font-size: 0.85rem;">ยังไม่มีประวัติการทอย</div>';
                this.dom.emptyMsg = document.getElementById('emptyMsg');
                this.dom.statTotal.textContent = '0';
                this.dom.statAvg.textContent = '0.0';
                this.dom.resNum.textContent = '--';
                this.dom.resNum.style.color = '#cbd5e1';
                this.dom.resBadge.textContent = 'พร้อมทอย';
                this.dom.resBadge.style.background = '#1e293b';
                this.dom.resBadge.style.color = '#94a3b8';
                this.dom.resTitle.textContent = 'กดปุ่มสุ่มโชคชะตา 21 หน้า';
                this.dom.resRange.textContent = '1-21';
                this.dom.outcomeCard.style.borderColor = 'rgba(51, 65, 85, 0.6)';
                this.dom.d21Num.textContent = '21';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new D21App();
        });
    </script>
</body>
</html>
